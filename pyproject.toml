[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ehai"
version = "0.1.0"
description = "Enhanced Human-Agent Interface execution plane"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "jsonschema>=4.25,<5",
    "mcp>=1.28,<2",
]

[project.scripts]
ehai = "ehai.interfaces.cli:main"
ehai-api = "ehai.interfaces.runtime:main"
ehai-mcp = "ehai.interfaces.mcp_server:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "types-jsonschema>=4.25,<5",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ehai"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
